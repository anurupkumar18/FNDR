name: release

on:
  push:
    tags: [ "v*" ]
  # A run by hand builds, signs and checks the app exactly as a tag push does,
  # then keeps the DMG as a workflow artifact. It publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The updater compares the installed version with the one in the build,
      # so a tag that names another version ships an update nobody receives.
      - name: The tag names the app version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" = "$GITHUB_REF_NAME" ]; then exit 0; fi
          echo "::error::Tag $GITHUB_REF_NAME does not name app version $version. Set the version in package.json, package-lock.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml and src-tauri/Cargo.lock, then tag v<version>."
          exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-release:
    name: Build and publish macOS release
    needs: verify
    # The same image as the Rust tests in test.yml: the speech helper needs the
    # macOS 26 SDK to compile, and src/dev/releaseDrift.test.ts holds the two together.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Developer ID signing + notarization turn on when these secrets exist.
      # Without them the build is ad-hoc signed, which macOS Gatekeeper blocks
      # until the user approves it in System Settings -> Privacy & Security.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Builds of llama.cpp configured against OpenSSL 4 must not come back.
          key: openssl3

      # lance-encoding's build script requires protoc.
      - name: Install protobuf
        run: brew install protobuf

      # llama.cpp's bundled HTTP client does not compile against OpenSSL 4,
      # which the macOS image carries since 2026-10-13. CMake finds 3 through
      # its root; CPATH gives its headers to the targets CMake does not.
      - name: Use OpenSSL 3
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          prefix="$(brew --prefix openssl@3)"
          echo "OPENSSL_ROOT_DIR=$prefix" >> "$GITHUB_ENV"
          echo "CPATH=$prefix/include" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build, sign, notarize and publish (Developer ID)
        if: env.HAS_APPLE_SIGNING == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        with:
          # Empty on a run by hand: with no tag, tauri-action builds and uploads nothing.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: "FNDR ${{ github.ref_name }}"
          releaseBody: |
            FNDR for macOS 13+ on Apple Silicon.

            1. Download the `.dmg` below and drag FNDR to Applications.
            2. Open FNDR and follow onboarding: it asks for Screen Recording
               and downloads its on-device search model (~90 MB).

            Signed with Developer ID and notarized by Apple. Later versions
            install from inside the app.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Build and publish (ad-hoc signed)
        if: env.HAS_APPLE_SIGNING != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Empty on a run by hand: with no tag, tauri-action builds and uploads nothing.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: "FNDR ${{ github.ref_name }}"
          releaseBody: |
            FNDR for macOS 13+ on Apple Silicon.

            1. Download the `.dmg` below and drag FNDR to Applications.
            2. Open FNDR. macOS will say it can't verify the developer, because
               this build isn't notarized yet. Open System Settings -> Privacy &
               Security, scroll down, and click "Open Anyway" next to FNDR.
            3. Follow onboarding: it asks for Screen Recording and downloads
               its on-device search model (~90 MB).
          releaseDraft: false
          # Stays a full release: the updater reads releases/latest, which
          # GitHub never points at a pre-release.
          prerelease: false
          includeUpdaterJson: true

      - name: Verify the signature
        run: |
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$HAS_APPLE_SIGNING" = "true" ]; then
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          fi

      # GitHub's /releases/latest/download/<name> URL only stays stable when
      # every full release carries the same asset name. Keep tauri-action's
      # versioned DMG and updater artifacts; this is an additional public alias.
      - name: Publish stable DMG download URL
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg_path=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$dmg_path"
          cp "$dmg_path" "$RUNNER_TEMP/FNDR-latest.dmg"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/FNDR-latest.dmg" --clobber
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fx 'FNDR-latest.dmg'

      - name: Keep the DMG from a run by hand
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FNDR-dmg-unpublished
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 3
