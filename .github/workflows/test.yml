name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck + frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      # The Python tests for the audit, team, model, bench and bootstrap scripts.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Script tests
        run: |
          python3 -m pip install --quiet -r scripts/audit/requirements.txt
          make scripts-test

  rust:
    name: Rust tests (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Builds of llama.cpp configured against OpenSSL 4 must not come back.
          key: openssl3
          cache-on-failure: true

      # lance-encoding's build script requires protoc.
      - name: Install protobuf
        run: brew install protobuf

      # llama.cpp's bundled HTTP client does not compile against OpenSSL 4,
      # which the macOS image carries since 2026-10-13. CMake finds 3 through
      # its root; CPATH gives its headers to the targets CMake does not.
      - name: Use OpenSSL 3
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          prefix="$(brew --prefix openssl@3)"
          echo "OPENSSL_ROOT_DIR=$prefix" >> "$GITHUB_ENV"
          echo "CPATH=$prefix/include" >> "$GITHUB_ENV"

      # tauri::generate_context! in the fndr bin requires frontendDist
      # ("../dist") to exist; tests don't need real frontend assets.
      - name: Create empty frontend dist
        run: mkdir -p dist

      - name: Rust tests
        run: cargo test --locked
        working-directory: src-tauri
