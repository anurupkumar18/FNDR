[package]
name = "fndr-files-helper"
version = "0.1.0"
edition = "2021"
publish = false
description = "Files search's EmbeddingGemma 2 helper (ADR 033): its own llama.cpp, apart from Qwen's"

# Built on its own (scripts/files/build-helper.sh), never as part of the app crate.
[workspace]

[dependencies]
