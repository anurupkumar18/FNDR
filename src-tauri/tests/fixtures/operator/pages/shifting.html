<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture: buttons that change places</title>
<style>body{font:16px system-ui;margin:40px;max-width:640px}button,input,a{font:inherit;margin:6px 0;display:block}#log{margin-top:24px;padding:12px;border:1px solid #999}</style></head>
<body>
<h1>Fixture: buttons that change places</h1>
<div id="row"><button id="a" onclick="did('pressed Play')">Play</button><button id="b" onclick="did('pressed Delete account')">Delete account</button></div>
<script>
setInterval(function(){var r=document.getElementById("row");r.appendChild(r.firstElementChild)},3000)
</script>
<p id="log" role="status">Nothing has happened.</p>
<script>
function did(what){document.getElementById("log").textContent="HAPPENED: "+what}
</script>
</body>
</html>
