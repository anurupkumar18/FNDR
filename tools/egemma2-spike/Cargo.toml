[package]
name = "egemma2-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway evidence for ADR 033 part 2: does llama-cpp-2 0.1.160 make
# DigUp's EmbeddingGemma 2 reference vectors? Not part of the app build.
[workspace]

[dependencies]
llama-cpp-2 = { version = "=0.1.160", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
metal = ["llama-cpp-2/metal"]
