[package]
name = "egemma2-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Evidence for ADR 033 part 2: FNDR's own EmbeddingGemma 2 embedder
# (src-tauri/src/files/gemma.rs, compiled here by path) against DigUp's
# reference vectors. Not part of the app build.
[workspace]

[dependencies]
llama-cpp-2 = { version = "=0.1.160", default-features = false, features = ["mtmd"] }
llama-cpp-sys-2 = { version = "=0.1.160", features = ["mtmd"] }
rusqlite = { version = "0.37", features = ["bundled"] }
half = "2.7"
unicode-normalization = "0.1"
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
quick-xml = "0.39.4"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
tempfile = "3"

[features]
default = []
metal = ["llama-cpp-2/metal"]
